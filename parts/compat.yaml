# What pf random may combine. Deterministic: the same seed always gives the same characters.

# A hairstyle sets up to three hair slots at once.
hairstyles:
  none: {weight: 1, parts: {}}
  long_straight: {weight: 3, parts: {hair_front: long_straight, hair_locks: long_straight, hair_back: long_straight}}
  short: {weight: 3, parts: {hair_front: short}}
  ponytail: {weight: 2, parts: {hair_front: ponytail, hair_back: ponytail}}
  bun: {weight: 2, parts: {hair_front: bun, hair_back: bun}}
  spiky: {weight: 2, parts: {hair_front: spiky, hair_back: spiky}}
  twintails: {weight: 2, parts: {hair_front: short, hair_back: twintails}}

# slot -> variant: weight ("none" leaves the slot empty)
slots:
  eyes: {dots: 1}
  torso_wear: {dress: 2, tunic: 3, robe: 2, plate: 2}
  over_torso: {none: 2, tabard: 1}
  belt: {none: 1, sash: 2, leather_belt: 2}
  legs_wear: {leggings: 3, greaves: 1}
  feet: {none: 2, boots: 2}
  hands: {none: 3, gauntlets: 1}
  headwear: {none: 6, hood: 1, pointed_hood: 2, great_helm: 1, sallet: 1, mitre: 1, mitre_tall: 1, wizard_hat: 1,
             winged_helm: 1, wing_cap: 1, ranger_hat: 2, bandana: 1, horned_helm: 1, witch_hat: 2, tricorn: 2,
             circlet: 1}
  cape: {none: 3, cloak: 1, mantle: 2}
  scarf: {none: 5, wrap: 1, long: 2}
  shoulders: {none: 4, pauldrons: 1}
  ears: {none: 6, elf: 1, cat: 1}
  beard: {none: 8, full: 1}
  held_near: {none: 2, sword: 3, staff: 1, bow: 1, mace: 1, lance: 1}
  held_far: {none: 4, shield: 1}

# A trim follows its parent part (the first rule that matches fills the slot).
trims:
  - {slot: held_near_trim, parent: held_near/sword, variant: hilt, chance: 1.0}
  - {slot: held_near_trim, parent: held_near/lance, variant: spearhead, chance: 1.0}
  - {slot: held_near_trim, parent: held_near/staff, variant: orb, chance: 0.6}
  - {slot: belt_trim, parent: belt/leather_belt, variant: buckle, chance: 0.7}
  - {slot: headwear_trim, parent: headwear/great_helm, variant: plume_tall, chance: 0.7}
  - {slot: headwear_trim, parent: headwear/sallet, variant: plume_tall, chance: 0.6}
  - {slot: headwear_trim, parent: headwear/ranger_hat, variant: feather, chance: 0.8}
  - {slot: headwear_trim, parent: headwear/tricorn, variant: feather, chance: 0.7}
  - {slot: headwear_trim, parent: headwear/horned_helm, variant: horns_curled, chance: 1.0}
  - {slot: headwear_trim, parent: headwear/wing_cap, variant: wings, chance: 1.0}
  - {slot: headwear_emblem, parent: headwear/great_helm, variant: cross_helm, chance: 0.4}
  - {slot: headwear_emblem, parent: headwear/mitre_tall, variant: cross_mitre, chance: 0.8}
  - {slot: headwear_emblem, parent: headwear/witch_hat, variant: hatband, chance: 0.7}

# A part needs one of these to be present.
requires:
  over_torso/tabard: [torso_wear/plate, torso_wear/tunic]
  hands/gauntlets: [torso_wear/plate]
  legs_wear/greaves: [torso_wear/plate]
  headwear/great_helm: [torso_wear/plate]
  headwear/sallet: [torso_wear/plate]
  headwear/winged_helm: [torso_wear/plate]
  headwear/mitre: [torso_wear/robe, torso_wear/dress]
  headwear/mitre_tall: [torso_wear/robe, torso_wear/dress]
  headwear/wing_cap: [torso_wear/plate]
  headwear/wizard_hat: [torso_wear/robe, torso_wear/dress]
  headwear/witch_hat: [torso_wear/robe, torso_wear/dress]
  held_near/mace: [torso_wear/plate, torso_wear/tunic]
  held_near/lance: [torso_wear/plate]
  shoulders/pauldrons: [torso_wear/plate, torso_wear/tunic]
  headwear/horned_helm: [torso_wear/plate, torso_wear/tunic]

# Pairs that never go together.
incompatible:
  - [torso_wear/robe, held_far/shield]
  - [torso_wear/robe, legs_wear/greaves]
  - [held_near/bow, held_far/shield]
  - [held_near/staff, held_far/shield]
  - [headwear/great_helm, held_near/staff]
  - [held_near/lance, held_far/shield]
  - [hair_back/bun, headwear/mitre]        # a bun would poke out around a tall hat
  - [hair_back/bun, headwear/wizard_hat]
  - [hair_back/bun, headwear/winged_helm]
  - [hair_back/bun, headwear/ranger_hat]
  - [hair_back/bun, headwear/witch_hat]
  - [hair_front/spiky, headwear/witch_hat]
  - [ears/cat, headwear/witch_hat]
  # spikes poke through anything but a bandana; cat ears through no hat
  - [hair_front/spiky, headwear/hood]
  - [hair_front/spiky, headwear/mitre]
  - [hair_front/spiky, headwear/wizard_hat]
  - [hair_front/spiky, headwear/winged_helm]
  - [hair_front/spiky, headwear/ranger_hat]
  - [ears/cat, headwear/hood]
  - [ears/cat, headwear/great_helm]
  - [ears/cat, headwear/sallet]
  - [ears/cat, headwear/mitre]
  - [ears/cat, headwear/wizard_hat]
  - [ears/cat, headwear/winged_helm]
  - [ears/cat, headwear/ranger_hat]
  - [ears/cat, headwear/bandana]
  - [ears/cat, headwear/horned_helm]
  - [ears/elf, headwear/hood]
  - [ears/elf, headwear/great_helm]
  - [ears/elf, headwear/sallet]
  - [ears/elf, headwear/horned_helm]
  - [beard/full, headwear/great_helm]
  - [beard/full, headwear/hood]
  - [beard/full, scarf/wrap]
  - [beard/full, scarf/long]
  - [beard/full, headwear/pointed_hood]
  # design pass 2 headwear: spikes, cat ears, a bun and elf ears poke through these too
  - [hair_front/spiky, headwear/pointed_hood]
  - [hair_front/spiky, headwear/tricorn]
  - [hair_front/spiky, headwear/mitre_tall]
  - [hair_front/spiky, headwear/wing_cap]
  - [hair_front/spiky, headwear/circlet]
  - [ears/cat, headwear/pointed_hood]
  - [ears/cat, headwear/tricorn]
  - [ears/cat, headwear/mitre_tall]
  - [ears/cat, headwear/wing_cap]
  - [ears/cat, headwear/circlet]
  - [ears/elf, headwear/pointed_hood]
  - [hair_back/bun, headwear/pointed_hood]
  - [hair_back/bun, headwear/tricorn]
  - [hair_back/bun, headwear/mitre_tall]
  - [hair_back/bun, headwear/wing_cap]
  - [hair_back/bun, headwear/circlet]
  - [hair_back/twintails, headwear/pointed_hood]
  - [hair_back/twintails, headwear/hood]
  - [hair_back/twintails, headwear/great_helm]
  - [hair_back/twintails, headwear/sallet]
  - [hair_back/twintails, headwear/horned_helm]

# Presets the randomizer never uses for heroes (glow eyes are reserved for monsters).
# Design pass 2: the anchor's own muted presets are kept for her, not dealt to random heroes.
exclude_presets:
  eyes: [glow red, glow yellow, glow ghost, glow leaf, navy (anchor)]
  skin: [light (anchor)]
  hair: [brown (anchor)]
  cloth: [navy (anchor)]
  leather: [brown (anchor)]
  accent: [gold (anchor)]

# Two-tone outfits: a part in one of these slots takes its own preset of its material this often
# (a scarlet cloak over a royal tunic), so random characters get a second signature color.
slot_colors:
  cape: 0.8
  scarf: 0.7
  headwear: 0.35
  headwear_trim: 0.6
  over_torso: 0.5
