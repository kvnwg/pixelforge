[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelforge"
version = "0.1.0"
description = "A reusable pixel art character, monster, combat and FX system with a locked chibi style."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.1",
    "numpy>=1.26",
    "PyYAML>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pf = "pixelforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
